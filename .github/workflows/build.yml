name: Build EPUB

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The epub stage runs EPUBCheck, so a successful build means a valid EPUB.
      - name: Build and validate EPUB
        run: docker build --target epub --output type=local,dest=out .
      - uses: actions/upload-artifact@v4
        with:
          name: sicp-epub
          path: out/sicp.epub
          if-no-files-found: error

  # Only pushes to main change the repo, so only they publish a release.
  # Pull requests, the weekly run and manual runs just verify the build.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sicp-epub
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          # A re-run of the same commit must not create a second release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" sicp.epub \
            --target "$GITHUB_SHA" \
            --title "SICP EPUB $tag" \
            --notes "EPUB built and validated from commit $GITHUB_SHA."
